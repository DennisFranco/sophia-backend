version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: sophia-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: sophia
    volumes:
      - sophia_mongo_data:/data/db

volumes:
  sophia_mongo_data: